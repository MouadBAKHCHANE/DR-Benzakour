            - heading "Une expertise au service de l'oncologie" [level=3] [ref=f16e582]
            - paragraph [ref=f16e583]: Ma pratique est principalement orientée vers la chirurgie cancérologique, qu'il s'agisse de pathologies digestives ou gynécologiques. Trois décennies d'activité m'ont permis d'accompagner de nombreux patients dans des parcours de soins complexes, avec une attention constante portée à la sécurité opératoire et à la qualité de vie post-opératoire. Chaque cas est discuté en réunion de concertation pluridisciplinaire (RCP) pour garantir la meilleure stratégie thérapeutique.
          - generic [ref=f16e584]:
            - heading "Cancers pris en charge" [level=3] [ref=f16e585]
            - list [ref=f16e586]:
              - listitem [ref=f16e587]: → Cancers œsogastriques (estomac, œsophage)
              - listitem [ref=f16e588]: → Cancers hépato-bilio-pancréatiques (foie, vésicule, pancréas)
              - listitem [ref=f16e589]: → Cancers colorectaux (côlon, rectum)
              - listitem [ref=f16e590]: → Cancer de l'ovaire avec ou sans carcinose péritonéale
              - listitem [ref=f16e591]: → Tumeurs rares du péritoine (pseudomyxome, mésothéliome, sarcomes)
          - generic [ref=f16e592]:
            - heading "Approche chirurgicale moderne" [level=3] [ref=f16e593]
            - paragraph [ref=f16e594]: La chirurgie cancérologique a considérablement évolué grâce aux approches mini-invasives. La cœlioscopie et la chirurgie robotique permettent d'opérer avec une précision millimétrique, de réduire les pertes sanguines et d'accélérer la reprise des traitements médicaux complémentaires (chimiothérapie, radiothérapie).
